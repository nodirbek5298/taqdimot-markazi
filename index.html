<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taqdimot Markazi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#06100f;--card:#0d1f1d;--tq:#1fc8b8;--gr:#1b8f5a;--gold:#d9b45a;--tx:#e6f5f2;--mu:#8fb3ad}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.pat{position:fixed;inset:0;z-index:-1;opacity:.5}
header{padding:28px 20px 20px;text-align:center;border-bottom:2px solid var(--gold);background:linear-gradient(180deg,#0a2a27,transparent)}
h1{margin:0;font-size:clamp(24px,5vw,38px);color:var(--tq);letter-spacing:1px}
header p{margin:6px 0 0;color:var(--mu)}
main{max-width:980px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid #17413c;border-radius:14px;padding:18px;margin-bottom:18px}
button,.btn{background:linear-gradient(135deg,var(--tq),var(--gr));color:#031210;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
button.sec{background:transparent;color:var(--tq);border:1px solid var(--tq)}
button.dng{background:transparent;color:#ff8d8d;border:1px solid #ff8d8d}
input{background:#071816;border:1px solid #1d4a45;color:var(--tx);border-radius:8px;padding:9px;width:100%;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.drop{border:2px dashed var(--tq);border-radius:14px;padding:26px;text-align:center;color:var(--mu);cursor:pointer}
.drop.on{background:#0f3a35}
.item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #17413c}
.item:last-child{border:0}
.item .nm{flex:1;min-width:160px;word-break:break-all}
.tag{font-size:11px;background:var(--gold);color:#222;border-radius:6px;padding:2px 7px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
#viewer{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column}
#viewer.show{display:flex}
#vbar{display:flex;gap:8px;padding:8px;background:#0a1d1b;align-items:center;flex-wrap:wrap}
#vbar span{color:var(--mu);flex:1;text-align:center}
#vbody{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#cv{max-width:100%;max-height:100%}
iframe{width:100%;height:100%;border:0}
.nav{position:absolute;top:0;bottom:0;width:18%;cursor:pointer}
#msg{color:var(--gold);font-size:14px;min-height:20px}
.hide{display:none}
</style>
</head>
<body>
<svg class="pat" width="100%" height="100%"><defs><pattern id="p" width="80" height="80" patternUnits="userSpaceOnUse">
<g fill="none" stroke="#1fc8b8" stroke-opacity=".18" stroke-width="1.2">
<rect x="20" y="20" width="40" height="40"/><rect x="20" y="20" width="40" height="40" transform="rotate(45 40 40)"/>
<circle cx="40" cy="40" r="9"/><path d="M0 0l20 20M80 0L60 20M0 80l20-20M80 80L60 60"/></g>
<circle cx="40" cy="40" r="2.5" fill="#d9b45a" fill-opacity=".35"/></pattern></defs>
<rect width="100%" height="100%" fill="url(#p)"/></svg>

<header><h1>✦ TAQDIMOT MARKAZI ✦</h1><p>Hujjatni yuklang — istalgan qurilmada oching, yuklab oling yoki taqdim eting</p></header>

<main>
<div class="card" id="setup">
 <b>⚙ GitHub sozlamasi</b> <small style="color:var(--mu)">(bir marta, shu brauzerda saqlanadi)</small><br><br>
 <label>GitHub username</label><input id="o" placeholder="nodirbek5298">
 <label>Repository nomi (hujjatlar shu yerda saqlanadi)</label><input id="r" placeholder="hujjatlarim">
 <label>Branch</label><input id="b" value="main">
 <label>Token (GitHub → Settings → Developer settings → Fine-grained token, Contents: Read and write)</label><input id="t" type="password" placeholder="github_pat_...">
 <button onclick="saveCfg()">Saqlash</button>
</div>

<div class="card" id="up">
 <div class="drop" id="drop" onclick="f.click()">📂 Faylni shu yerga tashlang yoki bosing<br><small>PDF, PPTX, DOCX va boshqalar</small></div>
 <input type="file" id="f" class="hide" multiple>
 <div id="msg"></div>
</div>

<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><b>📑 Hujjatlarim</b><div class="row"><button class="sec" onclick="load()">↻ Yangilash</button><button class="sec" onclick="setup.classList.toggle('hide')">⚙</button></div></div><div id="list"></div></div>
</main>

<div id="viewer">
 <div id="vbar"><button class="sec" onclick="closeV()">✕ Yopish</button><span id="vt"></span><button id="pr" class="sec">◀</button><button id="nx" class="sec">▶</button><button onclick="fs()">⛶ To'liq ekran</button></div>
 <div id="vbody"></div>
</div>

<script>
const $=id=>document.getElementById(id), DIR='hujjatlar';
let cfg={};try{cfg=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}
['o','r','b','t'].forEach(k=>{if(cfg[k])$(k).value=cfg[k]});
if(cfg.o&&cfg.r&&cfg.t)$('setup').classList.add('hide');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function saveCfg(){cfg={o:$('o').value.trim(),r:$('r').value.trim(),b:$('b').value.trim()||'main',t:$('t').value.trim()};
 try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}
 $('setup').classList.add('hide');load()}
const say=m=>$('msg').textContent=m;
const url=n=>`https://api.github.com/repos/${cfg.o}/${cfg.r}/contents/${DIR}${n?'/'+encodeURIComponent(n):''}`;
const H=(extra={})=>({Authorization:'Bearer '+cfg.t,Accept:'application/vnd.github+json',...extra});
async function load(){
 if(!cfg.o||!cfg.r){$('list').innerHTML='<p style="color:var(--mu)">Avval GitHub sozlamasini kiriting.</p>';return}
 $('list').innerHTML='<p style="color:var(--mu)">Yuklanmoqda…</p>';
 const r=await fetch(url('')+'?ref='+cfg.b+'&t='+Date.now(),{headers:H()});
 if(r.status==404){$('list').innerHTML='<p style="color:var(--mu)">Hozircha hujjat yo\'q.</p>';return}
 if(!r.ok){$('list').innerHTML='<p style="color:#ff8d8d">Xato: '+r.status+' (token yoki repo nomini tekshiring)</p>';return}
 const a=(await r.json()).filter(x=>x.type=='file'&&x.name!='.gitkeep');
 $('list').innerHTML=a.length?'':'<p style="color:var(--mu)">Hozircha hujjat yo\'q.</p>';
 a.forEach(x=>{const e=x.name.split('.').pop().toLowerCase(),d=document.createElement('div');d.className='item';
  d.innerHTML=`<span class="tag">${e.toUpperCase()}</span><span class="nm">${x.name}<br><small style="color:var(--mu)">${(x.size/1048576).toFixed(2)} MB</small></span>`;
  const row=document.createElement('div');row.className='row';
  const B=(t,c,fn)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=fn;row.appendChild(b)};
  if(e=='pdf'||e=='pptx'||e=='ppt')B('▶ Taqdim etish','',()=>present(x,e));
  B('⬇ Yuklab olish','sec',()=>dl(x));
  B('✎ Nomini o\'zgartirish','sec',()=>ren(x));
  B('⟳ Almashtirish','sec',()=>rep(x));
  B('🗑 O\'chirish','dng',()=>del(x));
  d.appendChild(row);$('list').appendChild(d)})
}
async function raw(x){const r=await fetch(x.url,{headers:H({Accept:'application/vnd.github.raw'})});if(!r.ok)throw 0;return r.blob()}
async function dl(x){try{const b=await raw(x),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=x.name;a.click()}catch(e){alert('Yuklab olib bo\'lmadi')}}
function b64(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(file)})}
async function put(name,file){
 let sha;const g=await fetch(url(name)+'?ref='+cfg.b,{headers:H()});if(g.ok)sha=(await g.json()).sha;
 const r=await fetch(url(name),{method:'PUT',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({message:'upload '+name,content:await b64(file),branch:cfg.b,sha})});
 if(!r.ok)throw new Error(r.status)}
async function upAll(files){
 if(!cfg.t){say('Avval sozlamani kiriting');setup.classList.remove('hide');return}
 for(const f of files){say('Yuklanmoqda: '+f.name+' …');try{await put(f.name,f)}catch(e){say('Xato: '+f.name+' ('+e.message+')');return}}
 say('✓ Yuklandi');load()}
$('f').onchange=e=>upAll([...e.target.files]);
const dr=$('drop');dr.ondragover=e=>{e.preventDefault();dr.classList.add('on')};dr.ondragleave=()=>dr.classList.remove('on');
dr.ondrop=e=>{e.preventDefault();dr.classList.remove('on');upAll([...e.dataTransfer.files])};
async function del(x){if(!confirm(x.name+' o\'chirilsinmi?'))return;
 await fetch(url(x.name),{method:'DELETE',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({message:'delete',sha:x.sha,branch:cfg.b})});load()}
async function ren(x){const n=prompt('Yangi nom:',x.name);if(!n||n==x.name)return;say('Nomi o\'zgartirilmoqda…');
 try{const b=await raw(x);await put(n,b);await fetch(url(x.name),{method:'DELETE',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({message:'rename',sha:x.sha,branch:cfg.b})});say('✓ Tayyor')}catch(e){say('Xato')}load()}
function rep(x){const i=document.createElement('input');i.type='file';i.onchange=async()=>{const f=i.files[0];if(!f)return;say('Almashtirilmoqda…');
 try{await put(x.name,f);say('✓ Tahrirlangan fayl almashtirildi')}catch(e){say('Xato')}load()};i.click()}

/* Taqdimot */
let pdf=null,pg=1;
async function present(x,e){
 $('viewer').classList.add('show');$('vt').textContent=x.name;const body=$('vbody');body.innerHTML='<p style="color:#8fb3ad">Yuklanmoqda…</p>';
 if(e=='pdf'){
  try{const buf=await (await raw(x)).arrayBuffer();pdf=await pdfjsLib.getDocument({data:buf}).promise;pg=1;
   body.innerHTML='<canvas id="cv"></canvas><div class="nav" style="left:0" onclick="go(-1)"></div><div class="nav" style="right:0" onclick="go(1)"></div>';draw()}
  catch(err){body.innerHTML='<p style="color:#ff8d8d">PDF ochilmadi</p>'}
  $('pr').onclick=()=>go(-1);$('nx').onclick=()=>go(1);$('pr').style.display=$('nx').style.display='';
 }else{
  $('pr').style.display=$('nx').style.display='none';
  const src=encodeURIComponent(x.download_url);
  body.innerHTML=`<iframe allowfullscreen src="https://view.officeapps.live.com/op/embed.aspx?src=${src}"></iframe>`}
}
async function draw(){const p=await pdf.getPage(pg),w=$('vbody'),v=p.getViewport({scale:1}),
 s=Math.min(w.clientWidth/v.width,w.clientHeight/v.height)*(devicePixelRatio||1),vp=p.getViewport({scale:s}),c=$('cv');
 c.width=vp.width;c.height=vp.height;c.style.width=vp.width/(devicePixelRatio||1)+'px';c.style.height=vp.height/(devicePixelRatio||1)+'px';
 await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;$('vt').textContent=pg+' / '+pdf.numPages}
function go(d){if(!pdf)return;const n=pg+d;if(n<1||n>pdf.numPages)return;pg=n;draw()}
function fs(){const v=$('viewer');document.fullscreenElement?document.exitFullscreen():v.requestFullscreen&&v.requestFullscreen()}
function closeV(){if(document.fullscreenElement)document.exitFullscreen();$('viewer').classList.remove('show');$('vbody').innerHTML='';pdf=null}
addEventListener('keydown',e=>{if(!$('viewer').classList.contains('show'))return;
 if(['ArrowRight','PageDown',' '].includes(e.key))go(1);if(['ArrowLeft','PageUp'].includes(e.key))go(-1);if(e.key=='Escape'&&!document.fullscreenElement)closeV();if(e.key=='f')fs()});
addEventListener('resize',()=>pdf&&draw());
load();
</script>
</body>
</html>
